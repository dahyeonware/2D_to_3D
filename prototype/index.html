<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KTX 장비 위치·연결 관계 3D 시각화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070d1a; --panel:#0d1628; --panel2:#111d35; --line:#1f2d4a; --line2:#2a3c60;
  --text:#dbe6ff; --muted:#7f92b8; --dim:#56698f;
  --cad:#3fd6e0; --cadbg:#08162e; --accent:#3fd6e0; --sel:#ffe066;
  --ok:#35d07f; --warn:#f2c94c; --bad:#ff5d5d;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand .logo{width:30px;height:30px;border:1.5px solid var(--cad);border-radius:6px;display:grid;place-items:center;color:var(--cad);font:600 11px var(--mono)}
.brand h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.search{position:relative;flex:0 1 260px;min-width:160px}
.search input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 10px 7px 30px;color:var(--text);font:12px var(--sans);outline:none}
.search input:focus{border-color:var(--cad)}
.search svg{position:absolute;left:9px;top:8px;opacity:.6}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;z-index:50;max-height:320px;overflow:auto;display:none;box-shadow:0 10px 30px #0008}
.results.open{display:block}
.results div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.results div:hover,.results div.on{background:#1c2b4d}
.results code{font:11px var(--mono);color:var(--cad)}
.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
select{background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:6px 8px;font:12px var(--sans);outline:none}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:3px 9px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.chip.on{color:var(--text);background:#16264a;border-color:#35507f}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.sep{width:1px;height:24px;background:var(--line)}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--cad)}

/* ---------- scenario bar ---------- */
.scenbar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:#0a1222;border-bottom:1px solid var(--line);overflow-x:auto}
.scenbar .lbl{color:var(--muted);font-size:11.5px;white-space:nowrap;margin-right:2px}
.scen{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;font-size:12px}
.scen b{font:600 11px var(--mono);color:#08162e;background:var(--cad);border-radius:4px;padding:0 5px}
.scen:hover{border-color:var(--cad)}
.scen.on{border-color:var(--sel);background:#1d2540}
.scen.on b{background:var(--sel)}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:var(--w2d,640px) 7px minmax(0,1fr) 7px var(--wp,340px);min-height:0}
.gutter{position:relative;background:var(--line);cursor:col-resize;z-index:5;touch-action:none}
.gutter::before{content:"";position:absolute;inset:0 -4px}
.gutter::after{content:"";position:absolute;left:2px;top:50%;width:3px;height:36px;margin-top:-18px;border-radius:2px;background:#3a5080}
.gutter:hover,.gutter.drag{background:#24406e}
.gutter:hover::after,.gutter.drag::after{background:var(--cad)}
body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
/* 드래그 조작 영역은 글자 선택 금지 (패널 글자는 복사 가능하도록 유지) */
.topbar,.scenbar,.panehead,.minimap,.drawing,.drawing *,.view3d,.view3d *,.gutter,.titleblock,.hint{user-select:none;-webkit-user-select:none}
.search input{user-select:text;-webkit-user-select:text}
body.resizing .main canvas,body.resizing .drawing{pointer-events:none}
.pane{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.panehead{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px}
.panehead .t{font-weight:700;letter-spacing:.02em}
.panehead .t span{color:var(--muted);font-weight:400;margin-left:6px}
.tabs{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-left:6px}
.tabs button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.tabs button.on{background:#16264a;color:var(--text)}
.iconbtn{border:1px solid var(--line2);background:transparent;border-radius:5px;width:26px;height:24px;cursor:pointer;color:var(--muted);font:600 13px var(--mono)}
.iconbtn:hover{color:var(--text);border-color:var(--cad)}

/* 2D */
.minimap{background:var(--cadbg);border-bottom:1px solid #12305a;padding:6px 10px 4px;position:relative}
.minimap svg{display:block;width:100%;height:34px;cursor:pointer}
.drawing{flex:1;position:relative;background:var(--cadbg);overflow:hidden;cursor:grab}
.drawing.drag{cursor:grabbing}
.drawing svg{position:absolute;inset:0;width:100%;height:100%}
.titleblock{position:absolute;right:10px;bottom:10px;border:1px solid var(--cad);background:#08162ee6;font:10.5px var(--mono);color:#9fe9ef;pointer-events:none;display:grid;grid-template-columns:auto auto}
.titleblock div{padding:3px 8px;border-right:1px solid #1d5a6b;border-bottom:1px solid #1d5a6b}
.titleblock div:nth-child(2n){border-right:0}
.titleblock .h{grid-column:1/3;color:#e8fbff;font-weight:600;font-size:11.5px;text-align:center}
.titleblock .k{color:#5fb3bf}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.blink{animation:blink 1.1s ease-in-out infinite}
.hint{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 270px);color:#4b7a9a;font:10.5px var(--mono);pointer-events:none}

/* 3D */
.view3d{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#13213f 0%,#070d1a 75%)}
.view3d canvas{display:block}
.carbtns{position:absolute;left:10px;top:10px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.carbtns button{border:1px solid var(--line2);background:#0d1628d9;border-radius:5px;padding:3px 7px;cursor:pointer;font:500 11px var(--mono);color:var(--muted)}
.carbtns button:hover{color:var(--text);border-color:var(--cad)}
.carbtns button.on{color:#08162e;background:var(--cad);border-color:var(--cad)}
.rangebtn{position:absolute;left:10px;bottom:62px;display:flex;align-items:center;gap:7px;background:#0d1628e6;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;color:#e3b8ff}
.rangebtn:hover{border-color:#c77dff}
.rangebtn.on{background:#2a1740;border-color:#c77dff;color:#fff}
.depth{position:absolute;left:10px;bottom:10px;background:#0d1628e6;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:12px}
.depth input{accent-color:var(--cad);width:110px}
.depth output{font:600 12px var(--mono);color:var(--cad);width:44px}
.banner{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:#0d1628f0;border:1px solid var(--sel);color:var(--sel);border-radius:999px;padding:5px 14px;font-size:12px;display:none;white-space:nowrap;box-shadow:0 6px 20px #0008}
.banner.on{display:block}
.banner.issue{border-color:#ff9f43;color:#ffc98a}
.banner.bad{border-color:var(--bad);color:#ffb3b3}
.tooltip{position:fixed;pointer-events:none;background:#0d1628f2;border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:12px;z-index:80;display:none;max-width:280px;box-shadow:0 8px 24px #000a}
.tooltip code{font:11px var(--mono);color:var(--cad);display:block}
.legendbox{position:absolute;right:10px;bottom:10px;background:#0d1628e6;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:11px;display:grid;grid-template-columns:auto auto;gap:3px 14px}
.legendbox .ttl{grid-column:1/3;color:var(--muted);font-size:10.5px;letter-spacing:.05em;margin-top:2px}
.legendbox span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legendbox i{display:inline-block;width:18px;height:3px;border-radius:2px}
.legendbox i.dash{height:0;border-top:2px dashed;background:none!important}
.legendbox.hidden{display:none}
.legendbox{max-height:calc(100% - 64px);overflow:auto;max-width:460px}
.legendbox .icongrid{grid-column:1/3;display:grid;grid-template-columns:repeat(3,auto);gap:4px 12px}
.eqhead{display:flex;gap:12px;align-items:center}
.eqhead .tile{width:52px;height:52px;border-radius:10px;border:1px solid;display:grid;place-items:center;background:#08162e;flex-shrink:0}
.conn .nm{display:flex;align-items:center;gap:5px}
.results div svg,.tooltip svg{margin-right:2px}

/* panel */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.panel .scroll{overflow:auto;flex:1;padding:14px}
.panel h2{font-size:16px;margin:2px 0 2px}
.panel .idline{font:12px var(--mono);color:var(--cad)}
.sect{margin-top:16px}
.sect h3{font-size:11px;color:var(--muted);letter-spacing:.06em;margin:0 0 7px;display:flex;align-items:center;gap:6px;font-weight:500}
.sect h3 .n{font:600 11px var(--mono);color:var(--text);background:#1a2a4c;border-radius:4px;padding:0 5px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.kv dd.mono{font:11.5px var(--mono)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.정상{color:var(--ok);border-color:#1f5c3d}
.badge.주의{color:var(--warn);border-color:#6b5820}
.badge.고장{color:var(--bad);border-color:#6b2a2a}
.catchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.catchip i{width:9px;height:9px;border-radius:2px}
.conn{display:grid;grid-template-columns:14px 1fr auto;gap:2px 8px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;cursor:pointer;background:var(--panel2)}
.conn:hover{border-color:var(--cad)}
.conn .dir{color:var(--muted);font:12px var(--mono);grid-row:1/3;align-self:center}
.conn .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn .nm code{font:10.5px var(--mono);color:var(--cad);margin-right:5px}
.conn .proto{font:10.5px var(--mono);border-radius:4px;padding:0 5px;align-self:start;white-space:nowrap}
.conn .meta{grid-column:2/4;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);font-size:12px;padding:6px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.actions .btn.on{border-color:var(--sel);color:var(--sel)}
.impact{border:1px solid #4a2630;background:#1d1220;border-radius:8px;padding:10px}
.impact .cars{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.impact .cars span{font:600 11px var(--mono);border-radius:4px;padding:1px 6px;background:#3a1a24;color:#ffb3b3}
.impact ul{margin:4px 0 0;padding:0;list-style:none;max-height:180px;overflow:auto}
.impact li{font-size:11.5px;padding:2px 0;cursor:pointer;display:flex;gap:6px;align-items:center}
.impact li:hover{color:var(--cad)}
.impact li code{font:10.5px var(--mono);color:#ff9e9e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
.stat b{display:block;font:600 18px var(--mono)}
.stat span{font-size:11px;color:var(--muted)}
.carlist{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.carlist button{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:5px 0;cursor:pointer;font:500 11px var(--mono)}
.carlist button small{display:block;color:var(--muted);font:10px var(--sans)}
.carlist button:hover{border-color:var(--cad)}
.note{color:var(--muted);font-size:11.5px;line-height:1.6}
.note b{color:var(--text);font-weight:500}
.panelfoot{border-top:1px solid var(--line);padding:8px 14px;color:var(--dim);font-size:10.5px}
.ptabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--line)}
.ptabs button{border:0;background:transparent;padding:7px 10px;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--text);border-bottom-color:var(--cad)}
.ptabs .n{font:600 10.5px var(--mono);background:#1a2a4c;border-radius:4px;padding:0 4px;margin-left:2px}
.mono{font-family:var(--mono)}
.tl{position:relative;padding-left:16px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tli{position:relative;padding:0 0 12px}
.tld{position:absolute;left:-16px;top:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--panel)}
.tlh{display:flex;align-items:center;gap:7px;font-size:12px}
.tlh .mono{font-size:11.5px}
.mt{font-size:10.5px;border:1px solid;border-radius:4px;padding:0 5px}
.res{margin-left:auto;font-size:10.5px;border-radius:4px;padding:0 5px}
.res.ok{color:var(--ok);background:#35d07f1a}.res.pending{color:var(--warn);background:#f2c94c1f}
.tli.first .tls{color:var(--text)}
.tls{font-size:12px;color:#b9c7e6;margin-top:3px}
.tlm{font-size:10.8px;color:var(--muted);margin-top:2px}
.tlm a,.ftab a{color:var(--cad)}
.mancard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.mancard h4,.mbox h4{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em;margin:12px 0 6px}
.virt{display:inline-block;font-size:10.8px;color:#ffb3b3;background:#ff5d5d1a;border:1px solid #6b2a2a;border-radius:4px;padding:1px 7px}
.ichip{font-size:11.5px;border:1px solid var(--line2);border-radius:5px;padding:2px 7px;background:#0d1628}
.safe{margin:0;padding-left:16px;font-size:12px}
.safe li{margin:2px 0}
.safe li::marker{color:var(--warn)}
.afault{margin-top:10px;font-size:12px;color:#ffd27a;background:#f2c94c14;border:1px solid #6b5820;border-radius:6px;padding:6px 8px}
.modal{position:fixed;inset:0;background:#030810b3;display:none;place-items:center;z-index:100;backdrop-filter:blur(2px)}
.modal.open{display:grid}
.mbox{position:relative;width:min(860px,92vw);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px 24px;box-shadow:0 30px 80px #000c}
.mclose{position:absolute;right:14px;top:12px;border:1px solid var(--line2);background:transparent;border-radius:6px;width:30px;height:28px;cursor:pointer;color:var(--muted)}
.mclose:hover{color:var(--text);border-color:var(--cad)}
.mhead{display:flex;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mhead .tile{width:52px;height:52px;border-radius:10px;border:1px solid;display:grid;place-items:center;background:#08162e;flex-shrink:0}
.mgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
.steps{margin:0;padding-left:18px;font-size:12.5px}
.steps li{margin:5px 0}
.steps label{cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.steps input{accent-color:var(--cad);margin-top:3px}
.steps input:checked+span{color:var(--muted);text-decoration:line-through}
.prog{font:11px var(--mono);color:var(--cad);margin-top:6px}
.ftab{width:100%;border-collapse:collapse;font-size:12px}
.ftab th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--line2);padding:6px 8px}
.ftab td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.ftab tr.hit td{background:#f2c94c1a;color:#ffe9a8}
.ftab tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.conn.x{grid-template-columns:14px minmax(0,1fr) 26px}
.conn.x .meta{grid-column:2/3;display:flex;align-items:center;gap:6px}
.conn.x .meta .proto{flex-shrink:0}
.conn.x .go{grid-row:1/3;grid-column:3}
.conn.x .nmt{overflow:hidden;text-overflow:ellipsis}
.conn.x.open{border-color:var(--cad);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;background:#14244a}
.dir.bi{color:var(--cad)!important;font-size:13px!important}
.dirnote{font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:0;margin-left:auto}
.caret{color:var(--cad);font-size:10px;width:9px;display:inline-block}
.go{border:1px solid var(--line2);background:#0d1628;border-radius:6px;width:26px;height:24px;cursor:pointer;color:var(--cad);font:600 13px var(--mono);align-self:center;padding:0}
.go:hover{background:var(--cad);color:#08162e;border-color:var(--cad)}
.sub{border:1px solid var(--cad);border-top:0;border-radius:0 0 7px 7px;background:#0a1324;margin-bottom:6px;padding:6px 6px 6px 10px}
.subh{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:2px 2px 6px}
.subh b{color:var(--text);font-weight:500}
.subh .n{font:600 10.5px var(--mono);background:#1a2a4c;border-radius:4px;padding:0 5px;color:var(--text)}
.sublist{max-height:196px;overflow:auto;padding-right:4px}
.si{display:grid;grid-template-columns:12px minmax(0,1fr) 26px;gap:2px 6px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11.8px}
.si .sm{grid-column:2/3;display:flex;gap:5px;align-items:center;padding-left:21px}
.si .go{grid-row:1/3;grid-column:3}
.si .dir{grid-row:1/3}
.nmc{min-width:0;line-height:1.3}
.nmc .nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si:last-child{border-bottom:0}
.si .dir{color:var(--muted);font:11px var(--mono)}
.si .nm{display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.si .nm code{font:10.5px var(--mono);color:var(--cad)}
.si .proto{font:10px var(--mono);border-radius:4px;padding:0 5px;white-space:nowrap}
.si.dup .nm{opacity:.55}
.dupb{font-size:10.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:4px;padding:0 5px;white-space:nowrap}
.navbar{display:flex;align-items:center;gap:6px;margin:-4px 0 12px}
.navb{flex-shrink:0;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;cursor:pointer;color:var(--text);padding:0}
.navb:hover:not(:disabled){border-color:var(--cad);color:var(--cad)}
.navb:disabled{opacity:.3;cursor:default}
.navl{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border:1px solid var(--line);border-radius:7px;font-size:12px;cursor:pointer;padding:0 8px}
.navl:not([id]){cursor:default}
.navl[id]:hover{border-color:var(--cad)}
.navl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navl .dimt{color:var(--dim)}
.backbtn{display:flex;align-items:center;gap:6px;width:100%;margin:-4px 0 12px;padding:6px 10px;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted);text-align:left}
.backbtn:hover{border-color:var(--cad);color:var(--text)}
.backbtn code{font:11px var(--mono);color:var(--cad)}
.backbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.backbtn em{margin-left:auto;font:normal 10.5px var(--mono);color:var(--dim)}
.cause{margin-top:12px;border-radius:8px;padding:9px 11px;border:1px solid}
.cause.bad{background:#2a1218;border-color:#7a2d36}
.cause.warn{background:#2a2410;border-color:#6b5820}
.cause .ch{display:flex;align-items:center;gap:7px;font-size:12.5px}
.cause.bad .ch b{color:#ffb3b3}.cause.warn .ch b{color:#ffe08a}
.cause .code{margin-left:auto;font:600 11px var(--mono);color:var(--text);background:#0008;border-radius:4px;padding:1px 6px}
.cause .tag{margin-left:auto;font-size:10.5px;color:#ffb3b3;border:1px dashed #7a2d36;border-radius:4px;padding:0 6px}
.cause .cb{font-size:12.3px;margin-top:5px;line-height:1.5}
.cause .cf{font-size:10.8px;color:var(--muted);margin-top:5px}
.cause a{color:var(--cad)}
.cause.pair{background:#2a1a0e;border-color:#7a4a1c}
.cause.pair .ch b{color:#ffc98a}
.cause .tag2{font-size:10.5px;color:#ffc98a;border:1px solid #7a4a1c;border-radius:4px;padding:0 6px}
.cause.pair .code{margin-left:auto}
.ptitle{font-weight:600;font-size:12.8px;margin-top:6px}
.partner{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11.8px;background:#0006;border-radius:6px;padding:5px 7px}
.partner span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.partner em{font:normal 10.5px var(--mono);color:#ffc98a;white-space:nowrap;margin:0 3px}
.partner .go{margin-left:auto;flex-shrink:0}
.partner .go+em{margin-left:4px}
.cause .ev{font-size:11.3px;color:#c9b59a;margin-top:5px;line-height:1.5}
.cause .ev b{color:#ffc98a;font-weight:500;margin-right:4px}
.conn.issue{border-color:#ff9f43;box-shadow:inset 3px 0 0 #ff9f43}
.isstag{color:#ff9f43}

const EQ = new Map(EQUIPMENT.map(e=>[e.id,e]));

const ADJ = new Map(EQUIPMENT.map(e=>[e.id,[]]));

/* 2D ↔ 3D 좌표 변환 (동일 기준: x = 편성 길이 방향, PC1 앞단 = 0) */
const SX = 14;                     // px / m (길이 방향)
const SY = {plan:82, side:58};     // px / m (평면: 횡방향 과장 표시, 측면: 높이)
const Coord = {
  // 장비 → 2D 도면 픽셀
  to2D(e, view){ return view==='plan'
      ? {x:e.pos2d.x*SX, y:e.pos2d.y*SY.plan}
      : {x:e.pos3d.x*SX, y:-Math.min(e.pos3d.y,6.2)*SY.side}; },
  // 2D 도면 픽셀 → 미터 (평면도 기준 x, 횡방향)
  from2D(px, py, view){ return view==='plan' ? {x:px/SX, lat:py/SY.plan} : {x:px/SX, h:-py/SY.side}; },
  // 장비 → Three.js 월드 좌표 (x 동일, y=높이, z=횡방향)
  to3D(e){ return new THREE.Vector3(e.pos3d.x, e.pos3d.y, e.pos3d.z); },
};

const state = {

const SEV = {'정상':0,'주의':1,'고장':2};
const ISSUE_COLOR = {'주의':'#ff9f43','고장':'#ff4d4d'};

/* ================= 그래프 탐색 ================= */
function neighbors(id, depth){
  const dist = new Map([[id,0]]), q=[id], edges=new Set();
  while(q.length){ const u=q.shift(), d=dist.get(u); if(d>=depth) continue;
    for(const {c,other} of ADJ.get(u)){ if(!connTypeOn(c)) continue;
      if(!dist.has(other)){ dist.set(other,d+1); q.push(other); }
      if(dist.get(other)>=d) edges.add(c.id);
    } }
  return {nodes:new Set(dist.keys()), edges, roots:new Set([id]), dist};
}
function impact(id){   // 하위 방향(장애 전파), 이중화 링크 제외
  const nodes=new Set([id]), edges=new Set(), q=[id];
  while(q.length){ const u=q.shift();
    for(const {c,other,dir} of ADJ.get(u)){ if(dir!=='out'||c.redundant) continue;
      edges.add(c.id); if(!nodes.has(other)){ nodes.add(other); q.push(other);} } }
  return {nodes, edges, roots:new Set([id])};
}
function upstream(id){  // 상위 공급·제어 경로 (가장 가까운 백본 방향 1개 경로)
  const nodes=new Set([id]), edges=new Set(), q=[id];
  while(q.length){ const u=q.shift();
    for(const {c,other,dir} of ADJ.get(u)){ if(dir!=='in') continue;
      edges.add(c.id); if(!nodes.has(other)){ nodes.add(other); q.push(other);} } }
  return {nodes, edges, roots:new Set([id])};
}
function upChain(id, layer){  // 상위 방향 최단 경로 (layer 별)
  const prev=new Map([[id,null]]), q=[id], order=[];
  while(q.length){ const u=q.shift(); order.push(u);
    for(const {c,other,dir} of ADJ.get(u)){ if(dir!=='in'||c.layer!==layer||prev.has(other)) continue; prev.set(other,{u,c}); q.push(other); } }
  // 가장 먼(최상위) 노드까지 경로
  let far=order[order.length-1]; if(far===id) return [];
  const chain=[]; let cur=far; while(cur!==id){ const p=prev.get(cur); chain.push({id:cur,c:p.c}); cur=p.u; }
  return chain; // 최상위 → 선택 장비 직전
}
function pathOf(ids){
  const nodes=new Set(ids), edges=new Set();
  for(let i=0;i<ids.length-1;i++){ const a=ids[i], b=ids[i+1];
    const hit=ADJ.get(a).find(x=>x.other===b); if(hit) edges.add(hit.c.id); }
  return {nodes, edges, roots:new Set([ids[0]])};
}

// 이상 상태 표시: 고장 = 빨간 위험 삼각형(!), 주의 = 노란 원(!)
function warnMark(st){
  const bang = (y)=>`<path d="M0 ${y-4.2}v4.4" stroke="#08162e" stroke-width="1.9" stroke-linecap="round"/><circle cx="0" cy="${y+2.6}" r="1.05" fill="#08162e"/>`;
  return st==='고장'
    ? `<g class="st blink" data-st="고장" transform="translate(7,-8)"><path d="M0 -7.5L7.6 5.5H-7.6Z" fill="#ff5d5d" stroke="#08162e" stroke-width="1.1" stroke-linejoin="round"/>${bang(1)}</g>`
    : `<g class="st" data-st="주의" transform="translate(7,-8)"><circle r="6.4" fill="#f2c94c" stroke="#08162e" stroke-width="1.1"/>${bang(0)}</g>`;
}
function symbolPath(shape, r, color, op=1, extra=''){
  const f=`fill="${color}" fill-opacity="${op}" ${extra}`;
  switch(shape){
    case 'rect': return `<rect x="${-r*1.3}" y="${-r*.85}" width="${r*2.6}" height="${r*1.7}" rx="1" ${f}/>`;
    case 'square': return `<rect x="${-r*.95}" y="${-r*.95}" width="${r*1.9}" height="${r*1.9}" rx="${r*.45}" ${f}/>`;
    case 'tri': return `<path d="M0 ${-r*1.15} L${r*1.1} ${r*.85} L${-r*1.1} ${r*.85}Z" ${f}/>`;
    case 'diamond': return `<path d="M0 ${-r*1.15} L${r*1.1} 0 L0 ${r*1.15} L${-r*1.1} 0Z" ${f}/>`;
    case 'hex': { let p=''; for(let i=0;i<6;i++){const a=Math.PI/3*i; p+=(i?'L':'M')+(Math.cos(a)*r*1.1).toFixed(2)+' '+(Math.sin(a)*r*1.1).toFixed(2);} return `<path d="${p}Z" ${f}/>`; }
    default: return `<circle r="${r}" ${f}/>`;
  }
}

/* ================= 창 크기 조절 (분할선 드래그) ================= */
const mainEl=document.querySelector('.main');
const LAYOUT={min2d:300, min3d:360, minP:280, maxP:620};
const lay={w2d:0, wp:340};
function layoutDefault(){ const W=mainEl.clientWidth; lay.wp=340; lay.w2d=Math.round((W-lay.wp-14)*0.45); }
function layoutClamp(){ const W=mainEl.clientWidth;
  lay.wp=Math.max(LAYOUT.minP,Math.min(LAYOUT.maxP,lay.wp, W-14-LAYOUT.min2d-LAYOUT.min3d));
  lay.w2d=Math.max(LAYOUT.min2d,Math.min(lay.w2d, W-14-lay.wp-LAYOUT.min3d));
  mainEl.style.setProperty('--w2d',lay.w2d+'px'); mainEl.style.setProperty('--wp',lay.wp+'px'); }
try{ const sv=JSON.parse(localStorage.getItem('ktx-layout')||'null'); if(sv&&sv.w2d){ lay.w2d=sv.w2d; lay.wp=sv.wp; } else layoutDefault(); }catch(_){ layoutDefault(); }
layoutClamp();
const saveLayout=()=>{ try{ localStorage.setItem('ktx-layout',JSON.stringify(lay)); }catch(_){} };
document.querySelectorAll('.gutter').forEach(g=>{
  g.addEventListener('pointerdown',e=>{ e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag'); document.body.classList.add('resizing');
    const r=mainEl.getBoundingClientRect();
    const move=ev=>{ if(g.dataset.g==='1') lay.w2d=ev.clientX-r.left-3; else lay.wp=r.right-ev.clientX-3; layoutClamp(); };
    const up=()=>{ g.classList.remove('drag'); document.body.classList.remove('resizing'); g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); saveLayout(); };
    g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); });
  g.addEventListener('dblclick',()=>{ layoutDefault(); layoutClamp(); saveLayout(); });
});
addEventListener('resize',layoutClamp);

const t2 = {k:1, x:20, y:0};   // 화면 변환

function build2D(){
  const v = state.view, sy = SY[v], L = TRAINSET.totalLength*SX;
  let g = '';
  // 그리드
  const gy0 = v==='plan' ? -5*sy : -7*sy, gy1 = v==='plan'? 4*sy : 1.5*sy;
  g += `<g stroke="#12305a" stroke-width="0.6">`;
  for(let x=-10;x<=TRAINSET.totalLength+10;x+=5) g+=`<line x1="${x*SX}" y1="${gy0}" x2="${x*SX}" y2="${gy1}" ${x%25===0?'stroke="#1a4378"':''}/>`;
  for(let y=Math.ceil(gy0/sy*2)/2; y*sy<=gy1; y+=0.5) g+=`<line x1="${-10*SX}" y1="${y*sy}" x2="${(TRAINSET.totalLength+10)*SX}" y2="${y*sy}"/>`;
  g += `</g>`;
  // 차체 외곽
  g += `<g fill="none" stroke="#3fd6e0" stroke-width="1.3">`;
  for(const c of CARS){
    const x0=c.start*SX, x1=(c.start+c.length)*SX, pc=c.type==='PC', front=c.side==='front';
    if(v==='plan'){
      const yT=-1.45*sy, yB=1.45*sy;
      if(pc){ const n=7*SX; const p = front
          ? `M${x0} 0 C${x0+n*.15} ${yT*0.85} ${x0+n*.5} ${yT} ${x0+n} ${yT} L${x1} ${yT} L${x1} ${yB} L${x0+n} ${yB} C${x0+n*.5} ${yB} ${x0+n*.15} ${yB*0.85} ${x0} 0Z`
          : `M${x1} 0 C${x1-n*.15} ${yT*0.85} ${x1-n*.5} ${yT} ${x1-n} ${yT} L${x0} ${yT} L${x0} ${yB} L${x1-n} ${yB} C${x1-n*.5} ${yB} ${x1-n*.15} ${yB*0.85} ${x1} 0Z`;
        g+=`<path d="${p}"/>`;
        const cab = front ? x0+4.2*SX : x1-4.2*SX; g+=`<line x1="${cab}" y1="${yT}" x2="${cab}" y2="${yB}" stroke-dasharray="4 3" stroke-width="0.8"/>`;
        const mr = front ? x0+13.5*SX : x1-13.5*SX; g+=`<line x1="${mr}" y1="${yT}" x2="${mr}" y2="${yB}" stroke-dasharray="4 3" stroke-width="0.8"/>`;
      } else {
        g+=`<rect x="${x0+3}" y="${yT}" width="${x1-x0-6}" height="${yB-yT}" rx="4"/>`;
        // 좌석 열 표시
        g+=`<g stroke="#1d5a6b" stroke-width="0.6">`;
        for(let s=c.start+4; s<c.start+c.length-3; s+=1.1){ g+=`<line x1="${s*SX}" y1="${-1.25*sy}" x2="${s*SX}" y2="${-0.35*sy}"/><line x1="${s*SX}" y1="${0.35*sy}" x2="${s*SX}" y2="${1.25*sy}"/>`; }
        g+=`</g>`;
        // 출입문
        const dx = c.type==='MC' ? (front? x0+2.4*SX : x1-2.4*SX) : x0+1.9*SX;
        g+=`<line x1="${dx-12}" y1="${yT}" x2="${dx+12}" y2="${yT}" stroke="#ffe066" stroke-width="2.5"/><line x1="${dx-12}" y1="${yB}" x2="${dx+12}" y2="${yB}" stroke="#ffe066" stroke-width="2.5"/>`;
      }
    } else {
      const yF=-1.0*sy, yR=-4.0*sy;
      if(pc){ const n=8*SX; const p = front
          ? `M${x0+4} ${yF} L${x1} ${yF} L${x1} ${yR} L${x0+n} ${yR} C${x0+n*.5} ${yR} ${x0+n*.12} ${-2.6*sy} ${x0} ${-1.5*sy} L${x0+4} ${yF}Z`
          : `M${x1-4} ${yF} L${x0} ${yF} L${x0} ${yR} L${x1-n} ${yR} C${x1-n*.5} ${yR} ${x1-n*.12} ${-2.6*sy} ${x1} ${-1.5*sy} L${x1-4} ${yF}Z`;
        g+=`<path d="${p}"/>`;
      } else g+=`<rect x="${x0+3}" y="${yR}" width="${x1-x0-6}" height="${yR*-1+yF}" rx="5"/>`;
      g+=`<line x1="${x0+6}" y1="${-1.25*sy}" x2="${x1-6}" y2="${-1.25*sy}" stroke-dasharray="6 4" stroke-width="0.7"/>`;
      // 창문
      if(!pc){ g+=`<g stroke-width="0.7">`; for(let s=c.start+4; s<c.start+c.length-3; s+=1.6) g+=`<rect x="${s*SX}" y="${-2.9*sy}" width="${0.9*SX}" height="${0.65*sy}" rx="2"/>`; g+=`</g>`; }
    }
  }
  g += `</g>`;
  // 대차
  g += `<g stroke="#7fb4c4" fill="none" stroke-width="1">`;
  for(const b of TRAINSET.bogies){ const x=b.x*SX;
    if(v==='plan') g+=`<rect x="${x-1.5*SX}" y="${-1.2*sy}" width="${3*SX}" height="${2.4*sy}" stroke-dasharray="3 2" rx="2"/><line x1="${x}" y1="${-1.4*sy}" x2="${x}" y2="${1.4*sy}" stroke-dasharray="1 2"/>`;
    else { g+=`<rect x="${x-1.5*SX}" y="${-0.95*sy}" width="${3*SX}" height="${0.35*sy}"/>`; for(const d of [-1.25,1.25]) g+=`<circle cx="${x+d*SX}" cy="${-0.46*sy}" r="${0.46*sy}"/>`; }
  }
  g += `</g>`;
  if(v==='side'){ g+=`<line x1="${-10*SX}" y1="0" x2="${(TRAINSET.totalLength+10)*SX}" y2="0" stroke="#3fd6e0" stroke-width="1.4"/>`;
    g+=`<line x1="${-10*SX}" y1="${-5.4*sy}" x2="${(TRAINSET.totalLength+10)*SX}" y2="${-5.4*sy}" stroke="#ff8a8a" stroke-width="0.9" stroke-dasharray="10 4"/>`;
    g+=`<text x="${-8*SX}" y="${-5.55*sy}" fill="#ff8a8a" font-size="9" font-family="IBM Plex Mono">전차선 AC 25kV</text>`;
    g+=`<text x="${-8*SX}" y="-5" fill="#3fd6e0" font-size="9" font-family="IBM Plex Mono">레일면 (RL ±0)</text>`; }
  else { for(const z of [-0.7175,0.7175]) g+=`<line x1="${-10*SX}" y1="${z*sy}" x2="${(TRAINSET.totalLength+10)*SX}" y2="${z*sy}" stroke="#1d4d6b" stroke-width="0.8"/>`;
    g+=`<text x="${-9*SX}" y="${-3.05*sy}" fill="#7f92b8" font-size="9" font-family="IBM Plex Mono">선로변 →</text>`; }
  // 치수선 + 차량 라벨
  const dy = v==='plan' ? -4.3*sy : -6.6*sy;
  g += `<g stroke="#5fb3bf" stroke-width="0.7" fill="#9fe9ef" font-family="IBM Plex Mono" font-size="10">`;
  for(const c of CARS){ const x0=c.start*SX, x1=(c.start+c.length)*SX;
    g+=`<line x1="${x0}" y1="${dy-6}" x2="${x0}" y2="${dy+8}"/><line x1="${x1}" y1="${dy-6}" x2="${x1}" y2="${dy+8}"/>`;
    g+=`<line x1="${x0}" y1="${dy}" x2="${x1}" y2="${dy}" marker-start="url(#ar)" marker-end="url(#ar)"/>`;
    g+=`<text x="${(x0+x1)/2}" y="${dy-4}" text-anchor="middle" stroke="none">${Math.round(c.length*1000).toLocaleString()}</text>`;
    g+=`<text x="${(x0+x1)/2}" y="${dy+(v==='plan'?24:22)}" text-anchor="middle" stroke="none" font-size="13" font-weight="600" fill="#e8fbff">${c.id}</text>`;
    g+=`<text x="${(x0+x1)/2}" y="${dy+(v==='plan'?37:35)}" text-anchor="middle" stroke="none" font-size="9.5" fill="#5fb3bf" font-family="Noto Sans KR">${c.name}</text>`;
  }
  g += `</g>`;

  // 연결선
  g += `<g id="g2fp"></g><g id="g2conn" fill="none"></g><g id="g2issue" fill="none" pointer-events="none"></g><g id="g2eq"></g><g id="g2warn" pointer-events="none"></g>`;
  const hatch = Object.entries(CATS).map(([k,c],i)=>`<pattern id="hp${i}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${c.color}" stroke-width="1" stroke-opacity=".35"/></pattern>`).join('');
  vp.innerHTML = `<defs>${hatch}<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 2 L5 5 L0 8" fill="none" stroke="#5fb3bf"/></marker></defs>` + g;

  const gc = vp.querySelector('#g2conn'), ge = vp.querySelector('#g2eq'), gf = vp.querySelector('#g2fp');
  conn2D = new Map(); eq2D = new Map(); fp2D = new Map(); warn2D = new Map();
  const catIdx = Object.fromEntries(Object.keys(CATS).map((k,i)=>[k,i]));
  const HIDDEN_ZONES = ['차체 하부','대차','궤도'];
  for(const e of EQUIPMENT){   // 실제 크기 외곽선 (배치도 표현, 확대 시 표시)
    const {x,y}=Coord.to2D(e,v), col=CATS[e.category].color;
    const w = e.dims.l*SX, hgt = v==='plan' ? e.dims.w*SY.plan : e.dims.h*SY.side;
    const yy = v==='plan' ? y-hgt/2 : y-hgt/2;

    r.setAttribute('x',x-w/2); r.setAttribute('y',yy); r.setAttribute('width',w); r.setAttribute('height',hgt); r.setAttribute('rx',Math.min(3,w/6));
    r.setAttribute('fill',`url(#hp${catIdx[e.category]})`); r.setAttribute('stroke',col); r.setAttribute('stroke-width','1.1'); r.setAttribute('vector-effect','non-scaling-stroke');

    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2 + (v==='plan'? bulge*0.7 : bulge*(c.type==='wireless'?-1.4:0.6));
    const p=document.createElementNS(NS,'path');

  buildMinimap();
  apply2D(); style2D();
}

    t2.k=s.k+(tk-s.k)*e; t2.x=s.x+(tx-s.x)*e; t2.y=s.y+(ty-s.y)*e; apply2D(); if(p<1) anim2D=requestAnimationFrame(step); };
  anim2D=requestAnimationFrame(step);
}

  const hl=state.hl;

    g.style.display = vis?'':'none';
    const inHL = !hl || hl.nodes.has(id);
    g.style.opacity = inHL?1:0.18;
    const halo=g.querySelector('.halo');
    const isRoot = hl && hl.roots.has(id);
    halo.setAttribute('opacity', isRoot?1: (hl&&state.mode==='impact'&&hl.nodes.has(id)?0.9:0));
    halo.setAttribute('stroke', state.mode==='impact'&&!isRoot?'#ff5d5d':'#ffe066');
    const st=statusOf(e);
    const fpr=fp2D.get(id); if(fpr){ fpr.style.display=vis?'':'none'; fpr.style.opacity=inHL?1:0.15; }
    let w=warn2D.get(id);
    if(w && w.dataset.st!==st){ w.remove(); warn2D.delete(id); w=null; }
    if(st!=='정상' && !w){ const gw=vp.querySelector('#g2warn'); gw.insertAdjacentHTML('beforeend', `<g class="wm" data-id="${id}" data-st="${st}" data-x="${g.dataset.x}" data-y="${g.dataset.y}">${warnMark(st)}</g>`);
      w=gw.lastElementChild; warn2D.set(id,w); applyWarnScale(w); }
    if(w) w.style.display = vis?'':'none';
  }
  for(const [id,p] of conn2D){ const c=CONN.get(id), vis=connVisible(c);
    p.style.display = vis?'':'none';
    const on = hl ? hl.edges.has(id) : false;

    if(is){   // 장치 간 문제가 있는 연결: 문제 색 굵은 점선 + 깜빡임
      p.setAttribute('stroke', ISSUE_COLOR[is.severity]); p.setAttribute('stroke-width', 3); p.setAttribute('stroke-dasharray','7 4'); p.classList.add('blink');
      p.setAttribute('stroke-opacity', !hl || on || is.devices.some(d=>hl.nodes.has(d)) ? 1 : 0.15);
      continue;
    }
    p.setAttribute('stroke-width', on?2.4:1);

  for(const it of issue2D){ const vis=it.is.devices.every(d=>eqVisible(EQ.get(d)));

}

const connObj=new Map();
const TRAY={data:{y:3.55,z:0.95}, power:{y:0.95,z:-0.95}};
function wiredCurve(a,b,layer,id){
  const t=TRAY[layer]; const off=(parseInt(id.slice(1))%5)*0.05;
  const ty=t.y+off*(layer==='data'?-1:1), tz=t.z+off*(layer==='data'?1:-1);
  const pts=[a, new THREE.Vector3(a.x,ty,tz), new THREE.Vector3(b.x,ty,tz), b];
  const path=new THREE.CurvePath(); for(let i=0;i<pts.length-1;i++) if(pts[i].distanceTo(pts[i+1])>1e-3) path.add(new THREE.LineCurve3(pts[i],pts[i+1]));
  return path;
}
for(const c of CONNECTIONS){
  const a=Coord.to3D(EQ.get(c.from)), b=Coord.to3D(EQ.get(c.to)); const col=new THREE.Color(PROTO[c.protocol].color);
  let curve, obj;
  if(c.type==='wired'){
    curve=wiredCurve(a,b,c.layer,c.id); const len=curve.getLength();
    const geo=new THREE.TubeGeometry(curve, Math.min(240,Math.max(12,Math.round(len*2.2))), c.protocol==='ETB'?0.065:0.048, 8, false);
    obj=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.12,roughness:0.32,metalness:0.25,transparent:true,opacity:0.45,depthWrite:false}));
  } else {
    const mid=a.clone().add(b).multiplyScalar(0.5); mid.y+=Math.max(1.2,a.distanceTo(b)*0.3);
    curve=new THREE.QuadraticBezierCurve3(a,mid,b);
    const geo=new THREE.BufferGeometry().setFromPoints(curve.getPoints(80));
    obj=new THREE.Line(geo,new THREE.LineDashedMaterial({color:col,dashSize:0.45,gapSize:0.3,transparent:true,opacity:0.6}));
    obj.computeLineDistances();

  obj.userData.id=c.id; scene.add(obj); connObj.set(c.id,{obj,curve,len:curve.getLength(),col,c});
}

// 장치 간 문제: 직접 연결 없는 경우 전용 이슈선(점선 튜브)

let fly=null;
function flyTo(target, pos, dur=900){ fly={t0:performance.now(),dur, fromP:camera.position.clone(), fromT:controls.target.clone(), toP:pos, toT:target}; }

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down3=null;
function pick(e){ const r=renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera); const hits=ray.intersectObjects(pickables.filter(m=>m.visible),false);
  const h=hits.find(x=>!state.hl||state.hl.nodes.has(x.object.userData.id)) || hits[0]; return h?h.object.userData.id:null; }

let lastMove=0;

  const id=pick(e); renderer.domElement.style.cursor=id?'pointer':''; id?showTip(id,e.clientX,e.clientY):hideTip(); });

function resize(){ const w=host.clientWidth, h=host.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(host);
new ResizeObserver(()=>{ apply2D(); }).observe(drawing);

const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime();
  if(fly){ const p=Math.min(1,(performance.now()-fly.t0)/fly.dur), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    camera.position.lerpVectors(fly.fromP,fly.toP,e); controls.target.lerpVectors(fly.fromT,fly.toT,e); if(p>=1) fly=null; }
  controls.update();
  // 선택/강조 펄스
  for(const [id,m] of eqMesh){ if(!m.visible) continue; const root=state.hl&&state.hl.roots.has(id);
    m.material.emissiveIntensity = root ? 0.8+0.6*Math.sin(t*6) : m.userData.base;
    if(root) m.scale.setScalar(1+0.18*(0.5+0.5*Math.sin(t*6))); }
  for(const [id,s] of stMarkers){ if(statusOf(EQ.get(id))==='고장') s.material.opacity=0.55+0.45*Math.sin(t*5.5); }
  if(halo.visible){ halo.quaternion.copy(camera.quaternion); const s=halo.userData.r*(1.2+0.35*((t*1.4)%1)); halo.scale.setScalar(s); halo.material.opacity=0.85-((t*1.4)%1)*0.75; }
  // 전파 링
  for(const r of rings){ if(!r.visible) continue; const ph=((t*0.6)+r.userData.phase)%1; r.scale.setScalar(0.2+ph*r.userData.maxR); r.material.opacity=0.65*(1-ph); r.quaternion.copy(camera.quaternion); }
  for(const r of wifiRings){ if(!r.visible) continue; const ph=((t*0.35)+r.userData.phase)%1; r.scale.setScalar(0.3+ph*4.2); r.material.opacity=0.35*(1-ph); }
  // 장치 간 문제 깜빡임
  const blinkK = 0.5+0.5*Math.sin(t*5.5);
  for(const [id,o] of connObj) if(o.issue && o.obj.visible) o.obj.material.emissiveIntensity = 0.25+0.85*blinkK;
  // 연결선 안을 지나가는 빛 (간격 일정, 속도 동일)
  let n=0; const hl=state.hl;
  for(const [id,o] of connObj){ if(!o.obj.visible) continue; const on=hl?hl.edges.has(id):true; if(!on) continue;
    const gap = hl ? 8 : 24; const k=Math.max(o.c.direction==='bidirectional'?2:1,Math.round(o.len/gap)); const inten = hl?1:0.55;
    tmpC.copy(o.issue ? new THREE.Color(ISSUE_COLOR[ISSUE_BY_CONN.get(id).severity]) : o.col).lerp(WHITE,0.35).multiplyScalar(inten);
    const bi=o.c.direction==='bidirectional';
    for(let i=0;i<k && n<MAXP;i++){ let u=((t*FLOW_SPEED/o.len)+i/k)%1; if(bi && i%2) u=1-u; o.curve.getPointAt(u,tmpV);
      pPos[n*3]=tmpV.x; pPos[n*3+1]=tmpV.y; pPos[n*3+2]=tmpV.z; pCol[n*3]=tmpC.r; pCol[n*3+1]=tmpC.g; pCol[n*3+2]=tmpC.b; n++; } }
  pGeo.setDrawRange(0,n); pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true;
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

// 무선 장비 판단: 직접 무선 연결이 있거나, 안테나(동축)로 무선에 연결된 장비, 또는 Wi-Fi AP
function wirelessLinksOf(id){
  const out=new Set();
  for(const {c,other} of ADJ.get(id)){
    if(c.type==='wireless') out.add(c.id);
    else if(c.protocol==='COAX') for(const x of ADJ.get(other)) if(x.c.type==='wireless') out.add(x.c.id);
  }
  return out;
}

/* ================= 선택·모드 ================= */
function recomputeHL(){
  const id=state.selected;
  if(state.mode==='neighbors' && id) state.hl=neighbors(id,state.depth);
  else if(state.mode==='impact' && id) state.hl=impact(id);
  else if(state.mode==='upstream' && id) state.hl=upstream(id);
  else if(state.mode==='path' || state.mode==='issues') {} // 유지
  else state.hl=null;
  // 연결 목록에서 펼친 장비의 직접 연결도 함께 강조
  if(state.expanded && state.hl && state.mode!=='path'){
    state.hl.nodes.add(state.expanded);
    for(const {c,other} of ADJ.get(state.expanded)){ if(!connTypeOn(c)) continue; state.hl.nodes.add(other); state.hl.edges.add(c.id); }
  }
}
let restoring=false;
const snap = () => ({id:state.selected, mode:state.mode, scenario:state.scenario, tab:state.tab, expanded:state.expanded, depth:state.depth, sim:[...state.simFault]});
function pushHistory(){
  if(restoring || !state.selected) return;
  state.history.push(snap()); if(state.history.length>30) state.history.shift();
  state.forward=[];   // 새 장비로 이동하면 앞으로 가기 기록은 비움
}
function goBack(){ const h=state.history.pop(); if(!h) return; state.forward.push(snap()); restoreSnap(h); }
function goForward(){ const h=state.forward.pop(); if(!h) return; state.history.push(snap()); restoreSnap(h); }
function restoreSnap(h){
  restoring=true;
  setDepth(h.depth); state.simFault=new Set(h.sim);
  if(h.scenario===3) SCEN[3](); else select(h.id,{mode:h.mode});
  state.scenario=h.scenario; markScen();
  state.tab=h.tab; state.expanded=h.expanded; recomputeHL(); refresh();
  restoring=false;
}
function select(id,{from='', mode='neighbors', fly=true}={}){
  if(state.selected!==id) pushHistory();
  state.showRange=false;
  state.selected=id; state.mode=mode; state.expanded=null; if(from) { state.scenario=null; markScen(); }
  recomputeHL(); refresh();
  if(fly){ if(mode==='neighbors' && state.depth===1 || from) focusEq(id); else focusSet(state.hl.nodes); }
  if(from!=='2d' || mode!=='neighbors') { if(mode==='neighbors' && state.depth===1) pan2DTo(id); else pan2DToSet(state.hl.nodes); }
}
function setMode(mode){ if(!state.selected) return; state.mode=mode; state.expanded=null; recomputeHL(); refresh(); focusSet(state.hl.nodes); pan2DToSet(state.hl.nodes); }
function resetAll(){ state.selected=null; state.mode='none'; state.expanded=null; state.showRange=false; state.history=[]; state.forward=[]; state.hl=null; state.simFault.clear(); state.scenario=null; markScen();
  refresh(); focusAll(); home2D(); }

function banner(){
  const b=$('#banner'); b.classList.remove('bad','issue');
  if(!state.hl){ b.classList.remove('on'); return; }
  let t='';
  if(state.mode==='neighbors') t=`연결 탐색 · 깊이 ${state.depth}-hop · 장비 ${state.hl.nodes.size}개 · 연결 ${state.hl.edges.size}개`;
  if(state.mode==='impact'){ const cars=new Set([...state.hl.nodes].map(i=>EQ.get(i).car)); t=`장애 영향 분석 · 영향 장비 ${state.hl.nodes.size-1}개 · 영향 차량 ${cars.size}량`; b.classList.add('bad'); }
  if(state.mode==='upstream') t=`상위 제어·전원 경로 추적 · 경로상 장비 ${state.hl.nodes.size}개`;
  if(state.mode==='path') t=state.pathLabel||'경로 표시';
  if(state.mode==='issues'){ const d=ISSUES.filter(i=>i.connection).length; t=`장치 간 문제 ${ISSUES.length}건 · 직접 연결 ${d}건(연결선 깜빡임) · 직접 연결 없음 ${ISSUES.length-d}건(이슈선)`; b.classList.add('issue'); }

  return `<div class="conn" data-id="${o.id}" title="${esc(c.description)}">
    ${dirMark(l)}
    <div class="nm">${iconOf(o)}<code>${o.id}</code>${esc(o.name)}</div>
    <span class="proto" style="background:${col}22;color:${col}">${esc(c.protocolName)}</span>
    <div class="meta">${esc(c.bandwidth)} · ${c.cableId||c.channel}${c.redundant?' · 이중화':''} · ${esc(c.description)}</div></div>`;
}
// 연결 방향 표시: 상하위가 분명하면 ↑/↓, 양방향 통신이면 ⇄
const dirMark = l => l.c.direction==='bidirectional'
  ? `<span class="dir bi" title="양방향 통신 (상하위 구분 없음)">⇄</span>`
  : `<span class="dir" title="${l.dir==='in'?'상위: 이 장비에 전원·제어를 주는 쪽':'하위: 이 장비가 전원·제어를 주는 쪽'}">${l.dir==='in'?'↑':'↓'}</span>`;
// 펼침형 연결 행: 행 클릭 = 그 장비의 연결 장치 펼치기/접기, → 버튼 = 그 장비로 이동
function connRowX(l, topSet){
  const o=EQ.get(l.other), c=l.c, col=PROTO[c.protocol].color, open=state.expanded===o.id;
  const sub = ADJ.get(o.id);
  const iss = ISSUE_BY_CONN.get(c.id);
  let h = `<div class="conn x ${open?'open':''} ${iss?'issue':''}" data-x="${o.id}" title="클릭: 연결 장치 펼치기">
    ${dirMark(l)}
    <div class="nm"><span class="caret">${open?'▾':'▸'}</span>${iconOf(o)}<code>${o.id}</code><span class="nmt">${esc(o.name)}</span></div>
    <button class="go" data-go="${o.id}" title="이 장비로 이동">→</button>
    <div class="meta"><span class="proto" style="background:${col}22;color:${col}">${esc(c.protocolName)}</span> ${esc(c.bandwidth)} · ${c.cableId||c.channel}${c.redundant?' · 이중화':''} · 연결 ${sub.length}${iss?` · <span class="isstag">⚠ 장치 간 문제 ${iss.id}</span>`:''}</div></div>`;
  if(open){
    h += `<div class="sub"><div class="subh">${iconOf(o)} <b>${esc(o.name)}</b>의 연결 장치 <span class="n">${sub.length}</span></div><div class="sublist">`
      + sub.map(s2=>{ const x=EQ.get(s2.other), pc=PROTO[s2.c.protocol].color;
          const cur = x.id===state.selected, dup = !cur && topSet.has(x.id);
          return `<div class="si${cur||dup?' dup':''}">
            ${dirMark(s2)}
            <div class="nm">${iconOf(x)}<div class="nmc"><div><code>${x.id}</code></div><div class="nmt">${esc(x.name)}</div></div></div>
            ${cur?'<span></span>':`<button class="go" data-go="${x.id}" title="이 장비로 이동">→</button>`}
            <div class="sm">${cur?'<span class="dupb">↺ 현재 장비</span>':dup?'<span class="dupb">↺ 위에 표시됨</span>':''}<span class="proto" style="background:${pc}22;color:${pc}">${esc(s2.c.protocolName)}</span></div>
          </div>`; }).join('')
      + `</div></div>`;
  }
  return h;
}
function bindRows(P){
  P.querySelectorAll('.conn.x').forEach(r=>r.onclick=ev=>{ if(ev.target.closest('.go')) return;
    const id=r.dataset.x; state.expanded = state.expanded===id ? null : id; recomputeHL(); refresh(); });
  P.querySelectorAll('.go[data-go]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); select(b.dataset.go,{from:'panel'}); }); P.querySelectorAll('.conn[data-id]').forEach(r=>r.onclick=()=>select(r.dataset.id,{from:'panel'})); }

function refresh(){ style2D(); style3D(); renderPanel(); banner(); updateRangeBtn(); }

/* ================= 검색 ================= */
const sIn=$('#search'), sRes=$('#results'); let sIdx=0, sItems=[];
function doSearch(){ const q=sIn.value.trim().toLowerCase(); if(!q){ sRes.classList.remove('open'); return; }
  sItems=EQUIPMENT.filter(e=>(e.id+' '+e.name+' '+e.code).toLowerCase().includes(q)).slice(0,10); sIdx=0;
  sRes.innerHTML = sItems.length ? sItems.map((e,i)=>`<div data-id="${e.id}" class="${i===0?'on':''}">${iconOf(e)}<code>${e.id}</code>${esc(e.name)}</div>`).join('') : '<div style="color:#7f92b8;cursor:default">결과 없음</div>';
  sRes.classList.add('open'); }
sIn.addEventListener('input',doSearch); sIn.addEventListener('focus',doSearch);
sIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+sItems.length)%Math.max(1,sItems.length); [...sRes.children].forEach((d,i)=>d.classList.toggle('on',i===sIdx)); }
  if(e.key==='Enter' && sItems[sIdx]){ select(sItems[sIdx].id,{from:'search'}); sRes.classList.remove('open'); sIn.blur(); }
  if(e.key==='Escape'){ sRes.classList.remove('open'); sIn.blur(); } });
sRes.addEventListener('mousedown',e=>{ const d=e.target.closest('[data-id]'); if(d){ select(d.dataset.id,{from:'search'}); sRes.classList.remove('open'); sIn.value=''; } });
sIn.addEventListener('blur',()=>setTimeout(()=>sRes.classList.remove('open'),120));

/* ================= 데모 시나리오 ================= */
function markScen(){ document.querySelectorAll('.scen').forEach(b=>b.classList.toggle('on',+b.dataset.s===state.scenario)); }
function setDepth(d){ state.depth=d; $('#depth').value=d; $('#depthOut').textContent=d+'-hop'; }
const SCEN={
  1(){ state.simFault.clear(); setDepth(3); select('PC1-TCMS-01',{mode:'neighbors'}); },
  2(){ state.simFault.clear(); state.simFault.add('MC1-CONV-01'); select('MC1-CONV-01',{mode:'impact'}); },
  3(){ if(state.selected!=='PC1-LTE-01') pushHistory(); state.showRange=false; state.simFault.clear(); state.selected='PC1-LTE-01'; state.mode='path'; state.expanded=null;
       state.hl=pathOf(['WAY-LTEBS-01','PC1-ANT-01','PC1-LTE-01','PC1-TCMS-01','PC1-ETBN-01']);
       state.hl.roots=new Set(['PC1-LTE-01']); state.pathLabel='LTE-R 통신 경로 · 지상 기지국 → 지붕 안테나 → 차상장치 → TCMS → 열차 백본';
       if(!state.wireless){ state.wireless=true; $('#tWireless').classList.add('on'); }
       refresh(); focusSet(state.hl.nodes); pan2DToSet(state.hl.nodes); },
  4(){ state.simFault.clear(); select('T3-DCU-01',{mode:'upstream'}); },
  5(){ pushHistory(); state.simFault.clear(); state.selected=null; state.mode='issues'; state.expanded=null; state.showRange=false;
       const nodes=new Set(ISSUES.flatMap(i=>i.devices)), edges=new Set(ISSUES.filter(i=>i.connection).map(i=>i.connection));
       state.hl={nodes, edges, roots:new Set(nodes)};
       refresh(); focusSet(nodes); pan2DToSet(nodes); },
};
document.querySelectorAll('.scen').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s;
  if(state.car!=='ALL'){ state.car='ALL'; $('#fCar').value='ALL'; }
  if(state.status!=='ALL'){ state.status='ALL'; $('#fStatus').value='ALL'; }
  state.cats=new Set(Object.keys(CATS)); document.querySelectorAll('#fCats .chip').forEach(c=>c.classList.add('on'));
  SCEN[s](); state.scenario=s; markScen(); });

/* ================= 시작 ================= */
resize(); build2D(); home2D();
camera.position.set(-34,34,58); controls.target.set(72,1.5,0);
refresh();
tick();
window.__app={state,select,SCEN};
</script>
</body>
